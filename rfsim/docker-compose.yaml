# OAI gNB + NR-UE in RF-simulator mode (OAI RAN tag 2026.w43), attached to the core.
#   docker compose -f rfsim/docker-compose.yaml up -d
# Host-level settings that keep the gNB stable in a container: SYS_NICE for real-time threads,
# unlimited memlock, a larger /dev/shm, and the 3/4 sampling rate (-E) to lower CPU load.
x-ran: &ran
  ulimits:
    memlock: -1
    rtprio: 99
  shm_size: 1gb
  restart: "no"

services:
  oai-gnb:
    <<: *ran
    container_name: oai-gnb
    image: oaisoftwarealliance/oai-gnb:2026.w43
    cap_drop: [ALL]
    cap_add: [SYS_NICE, IPC_LOCK]
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
      ASAN_OPTIONS: detect_leaks=0
    volumes:
      - ./gnb.conf:/opt/oai-gnb/etc/gnb.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep nr-softmodem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      public_net:
        ipv4_address: 192.168.70.150

  oai-nr-ue:
    <<: *ran
    container_name: oai-nr-ue
    image: oaisoftwarealliance/oai-nr-ue:2026.w43
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE, IPC_LOCK]
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3319680000 --rfsimulator.[0].serveraddr 192.168.70.150 --log_config.global_log_options level,nocolor,time
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./nrue.conf:/opt/oai-nr-ue/etc/nr-ue.conf:ro
    depends_on:
      oai-gnb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep nr-uesoftmodem"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      public_net:
        ipv4_address: 192.168.70.151

networks:
  public_net:
    name: demo-oai-public-net
    external: true
