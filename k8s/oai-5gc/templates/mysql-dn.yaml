apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mysql}
  ports:
    - {name: mysql, port: 3306}
---
# StatefulSet + PVC: subscriber data survives pod restarts
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mysql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mysql}
    spec:
      nodeSelector: {oai/role: {{ .Values.mysql.node }}}
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          args: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M"]
          env:
            - {name: TZ, value: {{ .Values.timezone }}}
            - {name: MYSQL_DATABASE, value: oai_db}
            - {name: MYSQL_USER, value: test}
            - {name: MYSQL_PASSWORD, value: test}
            - {name: MYSQL_ROOT_PASSWORD, value: linux}
          readinessProbe:
            exec: {command: ["/bin/bash", "/tmp/mysql-healthcheck.sh"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: db, mountPath: /docker-entrypoint-initdb.d/oai_db.sql, subPath: oai_db.sql}
            - {name: db, mountPath: /tmp/mysql-healthcheck.sh, subPath: mysql-healthcheck.sh}
      volumes:
        - name: db
          configMap: {name: oai-db}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.mysql.storage }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-traffic-server
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oai-traffic-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oai-traffic-server}
    spec:
      nodeSelector: {oai/role: {{ .Values.trafficServer.node }}}
      containers:
        - name: traffic-server
          image: {{ .Values.trafficServer.image }}
          securityContext: {privileged: true}
          env:
            # The pod network is routed point-to-point, so a "12.1.1.0/24 via UPF" route cannot
            # be installed; it is not needed because the UPF source-NATs UE traffic (enable_snat).
            - {name: USE_FQDN, value: "no"}
